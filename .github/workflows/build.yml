name: Build Boards

on:
  workflow_dispatch:
    inputs:
      board:
        description: '只编译这个板型；留空则按改动自动选择'
        required: false
        default: 'bread-compact-wifi'
        type: string
      chip:
        description: '只编译这个芯片：esp32s3 / esp32c3 / esp32c6 / esp32c5 / esp32p4 / esp32 / esp32s31'
        required: false
        default: 'esp32s3'
        type: string
  push:
    branches:
      - main
      - "ci/*" # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_BOARD: ${{ inputs.board }}
          TARGET_CHIP: ${{ inputs.chip || 'esp32s3' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git ls-files > "$CHANGED_FILE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout is the synthetic merge commit. Compare the PR branch
            # from its merge base, excluding unrelated updates on main.
            git diff --name-only --no-renames HEAD^1...HEAD^2 > "$CHANGED_FILE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ && "$GITHUB_REF" != "refs/heads/main" ]] && \
               BASE_SHA=$(git merge-base HEAD origin/main); then
            # First push of a ci/* branch has an all-zero before SHA.
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$CHANGED_FILE"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && \
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE_SHA" HEAD > "$CHANGED_FILE"
          else
            # A missing baseline (e.g. an unavailable force-pushed commit)
            # must not silently omit changed boards.
            git ls-files > "$CHANGED_FILE"
          fi

          cat "$CHANGED_FILE"

          # Keep the full manual matrix out of environment variables.
          python scripts/build.py --select-changed < "$CHANGED_FILE" > "$RUNNER_TEMP/variants.json"

          # 收窄矩阵：只保留指定板型 / 指定芯片，避免一次编译上百个变体。
          python - "$RUNNER_TEMP/variants.json" "$REQUESTED_BOARD" "$TARGET_CHIP" <<'PY'
          import json, sys
          path, board, chip = sys.argv[1], (sys.argv[2] or "").strip(), (sys.argv[3] or "").strip()
          variants = json.load(open(path, encoding="utf-8"))
          total = len(variants)
          if board:
              exact = [v for v in variants if v.get("name") == board]
              variants = exact or [v for v in variants if v.get("board") == board]
          if chip:
              variants = [v for v in variants if v.get("target") == chip]
          json.dump(variants, open(path, "w", encoding="utf-8"))
          print("variants: %d -> %d (board=%s, chip=%s)" % (total, len(variants), board or "*", chip or "*"))
          print("selected:", [v.get("name") for v in variants])
          PY

          {
            printf 'variants='
            cat "$RUNNER_TEMP/variants.json"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ matrix.ci_name || matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
